<!DOCTYPE html>

  </button>

  <input

    maxlength="6"
  >

  <button onclick="joinRoom()">
    加入房間
  </button>

  <p id="onlineMsg"></p>

</div>


<!-- ================= 等待室 ================= -->

<div id="waiting" class="card hidden">

  <h2 class="center">等待另一位玩家</h2>

  <div class="room" id="roomCode"></div>

  <p class="center" id="waitingStatus"></p>

  <button id="startOnlineButton"
          onclick="startOnlineGame()"
          disabled>
    開始選秀
  </button>

</div>


<!-- ================= 競標 ================= -->

<div id="auction" class="hidden">

  <div class="card">

    <div class="money-box">

      <div class="money">
        我的虛擬點數
        <b id="myMoney">20</b>
      </div>

      <div class="money">
        對手虛擬點數
        <b id="enemyMoney">20</b>
      </div>

    </div>

  </div>


  <div class="card">

    <div class="player-name" id="playerName">
      ---
    </div>

    <div class="position" id="playerPosition">
      ---
    </div>

    <div class="ovr">
      OVR <span id="playerOVR">--</span>
    </div>

    <div class="price">
      <span id="currentBid">0</span>
    </div>

    <div class="status" id="auctionStatus">
      ---
    </div>

    <input
      id="bidInput"
      type="number"
      min="1"
      placeholder="輸入出價"
    >

    <button id="bidButton" onclick="bid()">
      出價
    </button>

    <button id="passButton"
            onclick="pass()">
      放棄
    </button>

  </div>


  <div class="card">

    <h2>目前隊伍</h2>

    <div class="teams">

      <div class="team">
        <h3>你</h3>
        <div id="myTeam"></div>
      </div>

      <div class="team">
        <h3>對手</h3>
        <div id="enemyTeam"></div>
      </div>

    </div>

  </div>

</div>


<!-- ================= 比賽 ================= -->

<div id="series" class="card hidden">

  <h2 class="center">🏆 7 戰 4 勝</h2>

  <div class="score">
    <span id="myWins">0</span>
    -
    <span id="enemyWins">0</span>
  </div>

  <div id="gameLog"></div>

  <button id="nextGameButton"
          onclick="playNextGame()">
    開始下一場
  </button>

</div>


<!-- ================= 結束 ================= -->

<div id="result" class="card hidden">

  <h2 class="center">🏆 系列賽結果</h2>

  <div id="finalResult"
       class="center"

  </div>

  <button onclick="location.reload()">

</div>

</div>

/* =====================================================
   工具
===================================================== */

function shuffle(arr){

  return [...arr].sort(
    ()=>Math.random()-0.5
  );

}


function roomCode(){

  const chars =
  "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let s="";

  for(let i=0;i<6;i++){

    s += chars[
      Math.floor(Math.random()*chars.length)
    ];

  }

  return s;

}


function hideAll(){

  document
  .querySelectorAll(".container > div")
  .forEach(x=>x.classList.add("hidden"));

}


/* =====================================================
   模式
===================================================== */

window.showSingle=function(){

  hideAll();

  document
  .getElementById("singleSetup")
  .classList.remove("hidden");

};


window.showOnline=function(){

  hideAll();

  document
  .getElementById("onlineSetup")
  .classList.remove("hidden");

};


/* =====================================================
   遊戲變數
===================================================== */

let mode="";

let roomId="";

let role=0;

let localGame=null;

let myWins=0;

let enemyWins=0;

let gameNumber=0;


/* =====================================================
   單人模式
===================================================== */

window.startSingle=function(){

  mode="single";

  const list=shuffle(PLAYERS);

  localGame={

    players:list,

    index:0,

    bid:0,

    bidder:0,

    turn:1,

    money1:20,

    money2:20,

    team1:[],

    team2:[]

  };

  startAuctionSingle();

};


function startAuctionSingle(){

  hideAll();

  document
  .getElementById("auction")
  .classList.remove("hidden");

  renderSingle();

}


function renderSingle(){

  const g=localGame;

  if(g.index>=g.players.length){

    startSeries(
      g.team1,
      g.team2
    );

    return;

  }


  const p=g.players[g.index];

  document
  .getElementById("playerName")
  .textContent=p.name;

  document
  .getElementById("playerPosition")
  .textContent="位置："+p.position;

  document
  .getElementById("playerOVR")
  .textContent=p.ovr;

  document
  .getElementById("currentBid")
  .textContent=g.bid+" 點";

  document
  .getElementById("myMoney")
  .textContent=g.money1;

  document
  .getElementById("enemyMoney")
  .textContent=g.money2;

  showTeams(g.team1,g.team2);


  document
  .getElementById("bidButton")
  .disabled=g.turn!==1;

  document
  .getElementById("passButton")
  .disabled=g.turn!==1;


  document
  .getElementById("auctionStatus")
  .textContent=
  g.turn===1
  ?"你的回合"
  :"電腦思考中...";


  if(g.turn===2){

    setTimeout(cpuBid,700);

  }

}


/* =====================================================
   玩家出價
===================================================== */

window.bid=function(){

  if(mode==="single"){

    singleBid();

  }

  else{

    onlineBid();

  }

};


function singleBid(){

  const g=localGame;

  const value=
  Number(
    document
    .getElementById("bidInput")
    .value
  );

  if(!value ||
     value<=g.bid){

    alert("出價必須高於目前價格");

    return;

  }

  if(value>g.money1){

    alert("你的點數不夠");

    return;

  }


  g.bid=value;

  g.bidder=1;

  g.turn=2;

  document
  .getElementById("bidInput")
  .value="";

  renderSingle();

}


/* =====================================================
   電腦 AI
===================================================== */

function cpuBid(){

  const g=localGame;

  if(g.turn!==2)return;

  const p=g.players[g.index];

  const need=
  Math.round(
    p.ovr*0.12
    +
    Math.random()*5
  );

  const next=g.bid+1;

  if(
    next<=g.money2 &&
    next<=need
  ){

    g.bid=next;

    g.bidder=2;

    g.turn=1;

    renderSingle();

  }

  else{

    cpuPass();

  }

}


function cpuPass(){

  const g=localGame;

  if(g.bid===0){

    g.turn=1;

    renderSingle();

    return;

  }

  awardSingle();

}


/* =====================================================
   玩家放棄
===================================================== */

window.pass=function(){

  if(mode==="single"){

    if(localGame.bid===0){

      alert("目前還沒有人出價");

      return;

    }

    awardSingle();

  }

  else{

    onlinePass();

  }

};


/* =====================================================
   單人結算
===================================================== */

function awardSingle(){

  const g=localGame;

  const winner=g.bidder;

  const p=g.players[g.index];


  if(winner===1){

    g.money1-=g.bid;

    g.team1.push(p);

  }

  else{

    g.money2-=g.bid;

    g.team2.push(p);

  }


  g.index++;

  g.bid=0;

  g.bidder=0;

  g.turn=1;

  renderSingle();

}


/* =====================================================
   顯示隊伍
===================================================== */

function showTeams(a,b){

  document
  .getElementById("myTeam")
  .innerHTML=
  a.map(
    p=>`<p>${p.position} ${p.name}</p>`
  ).join("");

  document
  .getElementById("enemyTeam")
  .innerHTML=
  b.map(
    p=>`<p>${p.position} ${p.name}</p>`
  ).join("");

}


/* =====================================================
   線上建立房間
===================================================== */

window.createRoom=async function(){

  if(!user){

    alert("Firebase 尚未連線");

    return;

  }

  mode="online";

  role=1;

  roomId=roomCode();


  const room={

    host:user.uid,

    players:{

      p1:{
        uid:user.uid,
        money:20,
        team:[]
      }

    },

    list:shuffle(PLAYERS),

    started:false,

    index:0,

    bid:0,

    bidder:0,

    turn:1

  };


  await set(
    ref(db,"rooms/"+roomId),
    room
  );


  showWaiting();

  listenRoom();

};


function showWaiting(){

  hideAll();

  document
  .getElementById("waiting")
  .classList.remove("hidden");

  document
  .getElementById("roomCode")
  .textContent=roomId;

}


window.joinRoom=async function(){

  if(!user){

    alert("Firebase 尚未連線");

    return;

  }

  mode="online";

  role=2;

  roomId=
  document
  .getElementById("joinCode")
  .value
  .trim()
  .toUpperCase();


  if(!roomId){

    alert("請輸入房間代碼");

    return;

  }


  const snap=
  await get(
    ref(db,"rooms/"+roomId)
  );


  if(!snap.exists()){

    alert("找不到房間");

    return;

  }


  const room=snap.val();


  if(room.players?.p2){

    alert("房間已滿");

    return;

  }


  await update(
    ref(db,"rooms/"+roomId),
    {

      "players/p2":{
        uid:user.uid,
        money:20,
        team:[]
      }

    }
  );


  showWaiting();

  listenRoom();

};


/* =====================================================
   監聽房間
===================================================== */

function listenRoom(){

  onValue(
    ref(db,"rooms/"+roomId),
    snap=>{

      if(!snap.exists())return;

      const r=snap.val();

      const count=
      (r.players?.p1?1:0)
      +
      (r.players?.p2?1:0);


      document
      .getElementById("waitingStatus")
      .textContent=
      `目前 ${count}/2 位玩家`;


      document
      .getElementById("startOnlineButton")
      .disabled=
      !(role===1 && count===2);


      if(r.started){

        hideAll();

        document
        .getElementById("auction")
        .classList.remove("hidden");

        renderOnline(r);

      }

    }
  );

}


/* =====================================================
   線上開始
===================================================== */

window.startOnlineGame=async function(){

  if(role!==1)return;


  await update(
    ref(db,"rooms/"+roomId),
    {
      started:true,
      index:0,
      bid:0,
      bidder:0,
      turn:1
    }
  );

};


/* =====================================================
   線上畫面
===================================================== */

function renderOnline(r){

  const p=
  r.list[r.index];


  if(!p){

    startSeries(
      r.players.p1.team,
      r.players.p2.team
    );

    return;

  }


  document
  .getElementById("playerName")
  .textContent=p.name;

  document
  .getElementById("playerPosition")
  .textContent="位置："+p.position;

  document
  .getElementById("playerOVR")
  .textContent=p.ovr;

  document
  .getElementById("currentBid")
  .textContent=r.bid+" 點";


  const me=
  role===1
  ?r.players.p1
  :r.players.p2;

  const enemy=
  role===1
  ?r.players.p2
  :r.players.p1;


  document
  .getElementById("myMoney")
  .textContent=me.money;

  document
  .getElementById("enemyMoney")
  .textContent=enemy.money;


  showTeams(
    me.team||[],
    enemy.team||[]
  );


  const myTurn=
  r.turn===role;


  document
  .getElementById("bidButton")
  .disabled=!myTurn;

  document
  .getElementById("passButton")
  .disabled=!myTurn;


  document
  .getElementById("auctionStatus")
  .textContent=
  myTurn
  ?"你的回合"
  :"等待對手出價";

}


/* =====================================================
   線上出價
===================================================== */

async function onlineBid(){

  const snap=
  await get(
    ref(db,"rooms/"+roomId)
  );

  if(!snap.exists())return;

  const r=snap.val();

  if(r.turn!==role){

    alert("現在不是你的回合");

    return;

  }


  const value=
  Number(
    document
    .getElementById("bidInput")
    .value
  );


  const me=
  role===1
  ?r.players.p1
  :r.players.p2;


  if(!value || value<=r.bid){

    alert("出價必須高於目前價格");

    return;

  }


  if(value>me.money){

    alert("你的點數不夠");

    return;

  }


  await update(
    ref(db,"rooms/"+roomId),
    {

      bid:value,

      bidder:role,

      turn:role===1?2:1

    }
  );


  document
  .getElementById("bidInput")
  .value="";

}


/* =====================================================
   線上放棄
===================================================== */

async function onlinePass(){

  const snap=
  await get(
    ref(db,"rooms/"+roomId)
  );

  if(!snap.exists())return;

  const r=snap.val();


  if(r.turn!==role)return;


  if(r.bid===0){

    alert("目前還沒有出價");

    return;

  }


  const winner=r.bidder;

  const winnerKey=
  winner===1?"p1":"p2";


  const player=
  r.list[r.index];


  const oldTeam=
  r.players[winnerKey].team||[];


  const newTeam=[
    ...oldTeam,
    player
  ];


  const newMoney=
  r.players[winnerKey].money-r.bid;


  const updates={};


  updates[
    "players/"+winnerKey+"/money"
  ]=newMoney;


  updates[
    "players/"+winnerKey+"/team"
  ]=newTeam;


  updates.index=r.index+1;

  updates.bid=0;

  updates.bidder=0;

  updates.turn=1;


  await update(
    ref(db,"rooms/"+roomId),
    updates
  );

}


/* =====================================================
   系列賽
===================================================== */

function startSeries(team1,team2){

  window.team1=team1||[];

  window.team2=team2||[];

  myWins=0;

  enemyWins=0;

  gameNumber=0;


  hideAll();

  document
  .getElementById("series")
  .classList.remove("hidden");


  updateSeries();

}


function teamStrength(team){

  if(!team || team.length===0)
    return 70;


  const total=
  team.reduce(
    (sum,p)=>sum+p.ovr,
    0
  );


  return total/team.length;

}


function gameScore(team){

  const strength=
  teamStrength(team);

  const base=
  75+
  (strength-85)*0.9;

  return Math.max(
    65,
    Math.round(
      base+
      (Math.random()*22-11)
    )
  );

}


window.playNextGame=function(){

  if(
    myWins>=4 ||
    enemyWins>=4
  ){

    return;

  }


  gameNumber++;


  const s1=
  gameScore(window.team1);
