body{

/* =================================================
   基本工具
================================================= */

function shuffle(array){

return [...array].sort(
()=>Math.random()-0.5
);

}


function hideAll(){

document
.querySelectorAll(
".container > div"
)
.forEach(
el=>el.classList.add("hidden")
);

}


/* =================================================
   按鈕
================================================= */

document
.getElementById("singleMode")
.addEventListener(
"click",
()=>{

hideAll();

document
.getElementById("singleSetup")
.classList.remove("hidden");

}
);


document
.getElementById("onlineMode")
.addEventListener(
"click",
()=>{

hideAll();

document
.getElementById("onlineSetup")
.classList.remove("hidden");

}
);


/* =================================================
   遊戲變數
================================================= */

let mode="";

let roomId="";

let role=0;

let localGame=null;

let myWins=0;

let enemyWins=0;

let gameNumber=0;

let team1=[];

let team2=[];


/* =================================================
   單人開始
================================================= */

document
.getElementById("startSingleButton")
.addEventListener(
"click",
startSingle
);


function startSingle(){

mode="single";

localGame={

players:shuffle(PLAYERS),

index:0,

bid:0,

bidder:0,

turn:1,

money1:20,

money2:20,

team1:[],

team2:[]

};

startAuction();

}


/* =================================================
   競標畫面
================================================= */

function startAuction(){

hideAll();

document
.getElementById("auction")
.classList.remove("hidden");

renderSingle();

}


/* =================================================
   單人畫面
================================================= */

function renderSingle(){

const g=localGame;


if(g.index>=g.players.length){

startSeries(
g.team1,
g.team2
);

return;

}


const p=g.players[g.index];


document
.getElementById("playerName")
.textContent=p.name;

document
.getElementById("playerPosition")
.textContent=
"位置："+p.position;

document
.getElementById("playerOVR")
.textContent=p.ovr;

document
.getElementById("currentBid")
.textContent=g.bid;

document
.getElementById("myMoney")
.textContent=g.money1;

document
.getElementById("enemyMoney")
.textContent=g.money2;


showTeams(
g.team1,
g.team2
);


const myTurn=g.turn===1;


document
.getElementById("bidButton")
.disabled=!myTurn;

document
.getElementById("passButton")
.disabled=!myTurn;


document
.getElementById("auctionStatus")
.textContent=
myTurn
?"你的回合"
:"電腦思考中...";


if(g.turn===2){

setTimeout(
cpuAction,
700
);

}

}


/* =================================================
   出價
================================================= */

document
.getElementById("bidButton")
.addEventListener(
"click",
()=>{

if(mode==="single")
singleBid();

else
onlineBid();

}
);


/* =================================================
   單人出價
================================================= */

function singleBid(){

const g=localGame;

const value=
Number(
document
.getElementById("bidInput")
.value
);


if(
!value ||
value<=g.bid
){

alert(
"出價必須高於目前價格"
);

return;

}


if(value>g.money1){

alert(
"你的點數不夠"
);

return;

}


g.bid=value;

g.bidder=1;

g.turn=2;

document
.getElementById("bidInput")
.value="";

renderSingle();

}


/* =================================================
   電腦
================================================= */

function cpuAction(){

const g=localGame;

if(g.turn!==2)return;

const p=g.players[g.index];

/*
  AI 願意付的最高價格
*/

const maxBid=Math.max(
1,
Math.min(
g.money2,
Math.round(
p.ovr/15+
Math.random()*5
)
)
);

const next=g.bid+1;


if(
next<=g.money2 &&
next<=maxBid
){

g.bid=next;

g.bidder=2;

g.turn=1;

renderSingle();

}

else{

cpuPass();

}

}


function cpuPass(){

const g=localGame;


if(g.bid===0){

g.turn=1;

renderSingle();

return;

}


awardSingle();

}


/* =================================================
   放棄
================================================= */

document
.getElementById("passButton")
.addEventListener(
"click",
()=>{

if(mode==="single")
singlePass();

else
onlinePass();

}
);


function singlePass(){

const g=localGame;


if(g.bid===0){

alert(
"目前還沒有出價"
);

return;

}


awardSingle();

}


/* =================================================
   單人結算
================================================= */

function awardSingle(){

const g=localGame;

const p=g.players[g.index];


if(g.bidder===1){

g.money1-=g.bid;

g.team1.push(p);

}

else{

g.money2-=g.bid;

g.team2.push(p);

}


g.index++;

g.bid=0;

g.bidder=0;

g.turn=1;

renderSingle();

}


/* =================================================
   隊伍
================================================= */

function showTeams(a,b){

document
.getElementById("myTeam")
.innerHTML=
a.map(
p=>`<p>${p.position} ${p.name}</p>`
).join("");


document
.getElementById("enemyTeam")
.innerHTML=
b.map(
p=>`<p>${p.position} ${p.name}</p>`
).join("");

}


/* =================================================
   建立線上房間
================================================= */

document
.getElementById("createRoomButton")
.addEventListener(
"click",
createRoom
);


async function createRoom(){

if(!user){

alert(
"Firebase 還沒連線，請稍等"
);

return;

}


mode="online";

role=1;

roomId=generateRoomCode();


const data={

host:user.uid,

players:{

p1:{

uid:user.uid,

money:20,

team:[]

}

},

list:shuffle(PLAYERS),

started:false,

index:0,

bid:0,

bidder:0,

turn:1

};


await db
.ref("rooms/"+roomId)
.set(data);


showWaiting();

listenRoom();

}


/* =================================================
   房間代碼
================================================= */

function generateRoomCode(){

const chars=
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let code="";

for(let i=0;i<6;i++){

code+=chars[
Math.floor(
Math.random()*chars.length
)
];

}

return code;

}


/* =================================================
   等待室
================================================= */

function showWaiting(){

hideAll();

document
.getElementById("waiting")
.classList.remove("hidden");

document
.getElementById("roomCode")
.textContent=roomId;

}


/* =================================================
   加入
================================================= */

document
.getElementById("joinRoomButton")
.addEventListener(
"click",
joinRoom
);


async function joinRoom(){

if(!user){

alert(
"Firebase 還沒連線，請稍等"
);

return;

}


const code=
document
.getElementById("joinCode")
.value
.trim()
.toUpperCase();


if(!code){

alert("請輸入房間代碼");

return;

}


const snap=
await db
.ref("rooms/"+code)
.get();


if(!snap.exists()){

alert("找不到房間");

return;

}


const room=snap.val();


if(room.players?.p2){

alert("房間已經滿了");

return;

}


mode="online";

role=2;

roomId=code;


await db
.ref("rooms/"+roomId+"/players/p2")
.set({

uid:user.uid,

money:20,

team:[]

});


showWaiting();

listenRoom();

}


/* =================================================
   監聽
================================================= */

function listenRoom(){

db.ref("rooms/"+roomId)
.on(
"value",
snap=>{

if(!snap.exists())return;

const r=snap.val();


const count=
(r.players?.p1?1:0)
+
(r.players?.p2?1:0);


document
.getElementById("waitingStatus")
.textContent=
`目前 ${count}/2 位玩家`;


document
.getElementById("startOnlineButton")
.disabled=
!(role===1 && count===2);


if(r.started){

hideAll();

document
.getElementById("auction")
.classList.remove("hidden");

renderOnline(r);

}

}
);

}


/* =================================================
   線上開始
================================================= */

document
.getElementById("startOnlineButton")
.addEventListener(
"click",
async()=>{

if(role!==1)return;


await db
.ref("rooms/"+roomId)
.update({

started:true,

index:0,

bid:0,

bidder:0,

turn:1

});

}
);


/* =================================================
   線上畫面
================================================= */

function renderOnline(r){

const p=r.list[r.index];


if(!p){

startSeries(
r.players.p1.team,
r.players.p2.team
);

return;

}


document
.getElementById("playerName")
.textContent=p.name;

document
.getElementById("playerPosition")
.textContent=
"位置："+p.position;

document
.getElementById("playerOVR")
.textContent=p.ovr;

document
.getElementById("currentBid")
.textContent=r.bid;


const me=
role===1
?r.players.p1
:r.players.p2;


const enemy=
role===1
?r.players.p2
:r.players.p1;


document
.getElementById("myMoney")
.textContent=me.money;

document
.getElementById("enemyMoney")
.textContent=enemy.money;


showTeams(
me.team||[],
enemy.team||[]
);


const myTurn=
r.turn===role;


document
.getElementById("bidButton")
.disabled=!myTurn;

document
.getElementById("passButton")
.disabled=!myTurn;


document
.getElementById("auctionStatus")
.textContent=
myTurn
?"你的回合"
:"等待對手出價";

}


/* =================================================
   線上出價
================================================= */

async function onlineBid(){

const snap=
await db
.ref("rooms/"+roomId)
.get();


const r=snap.val();


if(r.turn!==role){

alert("現在不是你的回合");

return;

}


const value=
Number(
document
.getElementById("bidInput")
.value
);


const me=
role===1
?r.players.p1
:r.players.p2;


if(
!value ||
value<=r.bid
){

alert(
"出價必須高於目前價格"
);

return;

}


if(value>me.money){

alert("你的點數不夠");

return;

}


await db
.ref("rooms/"+roomId)
.update({

bid:value,

bidder:role,

turn:
role===1?2:1

});


document
.getElementById("bidInput")
.value="";

}


/* =================================================
   線上放棄
================================================= */

async function onlinePass(){

const snap=
await db
.ref("rooms/"+roomId)
.get();


const r=snap.val();


if(r.turn!==role)return;


if(r.bid===0){

alert(
"目前還沒有出價"
);

return;

}


const winner=r.bidder;

const key=
winner===1?"p1":"p2";

const p=r.list[r.index];

const playerData=
r.players[key];


const team=[
...(playerData.team||[]),
p
];


const updates={};


updates[
"players/"+key+"/money"
]=
playerData.money-r.bid;


updates[
"players/"+key+"/team"
]=team;


updates.index=
r.index+1;

updates.bid=0;

updates.bidder=0;

updates.turn=1;


await db
.ref("rooms/"+roomId)
.update(updates);

}


/* =================================================
   7 戰 4 勝
================================================= */

function startSeries(a,b){

team1=a||[];

team2=b||[];

myWins=0;

enemyWins=0;

gameNumber=0;


hideAll();

document
.getElementById("series")
.classList.remove("hidden");

document
.getElementById("gameLog")
.innerHTML="";

updateSeries();

}


function strength(team){

if(!team.length)
return 80;


return team.reduce(
(sum,p)=>sum+p.ovr,
0
)/team.length;

}


function score(team){

const s=strength(team);

return Math.max(
65,
Math.round(
75+
(s-85)*0.9+
(Math.random()*20-10)
)
);

}


document
.getElementById("nextGameButton")
.addEventListener(
"click",
playGame
);


function playGame(){

if(
myWins>=4||
enemyWins>=4
)return;


gameNumber++;


let a=score(team1);

let b=score(team2);


if(a===b)
a++;


if(a>b)
myWins++;
else
enemyWins++;


document
.getElementById("gameLog")
.innerHTML+=`

<div class="game">

第 ${gameNumber} 場

<br>

<b>${a} - ${b}</b>

<br>

${a>b
?"🏆 你獲勝"
:"對手獲勝"}

</div>

`;


updateSeries();


if(
myWins>=4||
enemyWins>=4
){

setTimeout(
finishSeries,
500
);

}

}


function updateSeries(){

document
.getElementById("myWins")
.textContent=myWins;

document
.getElementById("enemyWins")
.textContent=enemyWins;


document
.getElementById("nextGameButton")
.disabled=
myWins>=4||
enemyWins>=4;

}


function finishSeries(){

hideAll();

document
.getElementById("result")
.classList.remove("hidden");


document
.getElementById("finalResult")
.innerHTML=
