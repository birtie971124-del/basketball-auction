<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏀 20點籃球選秀</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans TC",sans-serif;
  background:#101827;
  color:white;
  min-height:100vh;
}

.container{
  width:92%;
  max-width:600px;
  margin:auto;
  padding:30px 0;
}

h1{
  text-align:center;
  margin-bottom:30px;
}

.card{
  background:#1b2638;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.25);
}

button{
  width:100%;
  border:none;
  border-radius:12px;
  padding:15px;
  margin-top:12px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  background:#2563eb;
  color:white;
}

button:active{
  transform:scale(.98);
}

button.secondary{
  background:#374151;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:none;
  margin-top:10px;
  font-size:17px;
}

.hidden{
  display:none;
}

.room-code{
  font-size:30px;
  text-align:center;
  letter-spacing:6px;
  font-weight:bold;
  margin:20px 0;
}

.player-box{
  background:#243247;
  padding:18px;
  border-radius:14px;
  margin-top:15px;
}

.status{
  text-align:center;
  padding:12px;
  background:#243247;
  border-radius:10px;
  margin:15px 0;
}

.bid{
  font-size:25px;
  text-align:center;
  margin:15px;
}

.money{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.player-name{
  font-size:25px;
  font-weight:bold;
}

.position{
  color:#9ca3af;
}

.message{
  text-align:center;
  margin:15px 0;
  min-height:24px;
}
</style>
</head>

<body>

<div class="container">

<h1>🏀 20點籃球選秀</h1>

<!-- 首頁 -->
<div id="home">

  <div class="card">
    <h2>🤖 單人模式</h2>
    <p>你 vs 電腦</p>
    <button id="singleBtn" type="button">
      開始單人遊戲
    </button>
  </div>

  <div class="card">
    <h2>👥 雙人線上</h2>
    <p>兩支手機即時競標</p>

    <button id="createBtn" type="button">
      建立房間
    </button>

    <input
      id="roomInput"
      type="text"
      placeholder="輸入6碼房號"
      maxlength="6"
      autocomplete="off"
    >

    <button id="joinBtn" type="button">
      進入房間
    </button>
  </div>

</div>


<!-- 等待房間 -->
<div id="lobby" class="hidden">

  <div class="card">

    <h2>🏠 房間</h2>

    <p>房號：</p>

    <div id="roomCode" class="room-code">
      ------
    </div>

    <div class="player-box">
      <b>玩家 1：</b>
      <span id="p1Status">等待中</span>
    </div>

    <div class="player-box">
      <b>玩家 2：</b>
      <span id="p2Status">等待中</span>
    </div>

    <div id="lobbyMessage" class="message"></div>

    <button id="startBtn" type="button" class="hidden">
      開始競標
    </button>

    <button id="backBtn" type="button" class="secondary">
      返回首頁
    </button>

  </div>

</div>


<!-- 競標 -->
<div id="auction" class="hidden">

  <div class="card">

    <h2>🏀 籃球競標</h2>

    <div class="player-box">

      <div id="auctionPlayer" class="player-name">
        球員
      </div>

      <div id="auctionPosition" class="position">
        PG
      </div>

      <h3 id="auctionOVR">
        OVR 90
      </h3>

    </div>

    <div class="bid">
      目前價格：
      <b id="currentBid">0</b>
      點
    </div>

    <div class="status" id="turnText">
      等待中
    </div>

    <div class="money">

      <div>
        你的點數：
        <b id="myMoney">20</b>
      </div>

      <div>
        對手：
        <b id="enemyMoney">20</b>
      </div>

    </div>

    <input
      id="bidInput"
      type="number"
      min="1"
      placeholder="輸入出價"
    >

    <button id="bidBtn" type="button">
      出價
    </button>

    <button id="passBtn" type="button" class="secondary">
      放棄競標
    </button>

    <div id="auctionMessage" class="message"></div>

  </div>

  <div class="card">

    <h3>你的球員</h3>
    <div id="myTeam">尚未選到球員</div>

  </div>

</div>


<!-- 系列賽 -->
<div id="series" class="hidden">

  <div class="card">

    <h2>🏆 7戰4勝</h2>

    <div id="seriesResult"></div>

    <button id="nextGameBtn" type="button">
      開始比賽
    </button>

  </div>

</div>

</div>


<!-- Firebase Compat -->
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>


<script>

/* =========================
   Firebase
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyDmznVguxE2kvvcmbtBu5FE3PNi_Bt4HoU",
  authDomain: "basketball-draft-13f1a.firebaseapp.com",
  projectId: "basketball-draft-13f1a",
  storageBucket: "basketball-draft-13f1a.firebasestorage.app",
  messagingSenderId: "783139855533",
  appId: "1:783139855533:web:079f8e1450f78583227a24"
};

let firebaseReady = false;
let db = null;
let auth = null;
let currentUser = null;

try {

  firebase.initializeApp(firebaseConfig);

  db = firebase.database();
  auth = firebase.auth();

  firebaseReady = true;

  console.log("Firebase 初始化成功");

} catch(error){

  console.error("Firebase 初始化失敗",error);

}


/* =========================
   DOM
========================= */

const home = document.getElementById("home");
const lobby = document.getElementById("lobby");
const auction = document.getElementById("auction");
const series = document.getElementById("series");

const singleBtn = document.getElementById("singleBtn");
const createBtn = document.getElementById("createBtn");
const joinBtn = document.getElementById("joinBtn");

const roomInput = document.getElementById("roomInput");

const roomCode = document.getElementById("roomCode");

const p1Status = document.getElementById("p1Status");
const p2Status = document.getElementById("p2Status");

const lobbyMessage = document.getElementById("lobbyMessage");

const startBtn = document.getElementById("startBtn");
const backBtn = document.getElementById("backBtn");

const auctionPlayer = document.getElementById("auctionPlayer");
const auctionPosition = document.getElementById("auctionPosition");
const auctionOVR = document.getElementById("auctionOVR");

const currentBid = document.getElementById("currentBid");
const turnText = document.getElementById("turnText");

const myMoney = document.getElementById("myMoney");
const enemyMoney = document.getElementById("enemyMoney");

const bidInput = document.getElementById("bidInput");
const bidBtn = document.getElementById("bidBtn");
const passBtn = document.getElementById("passBtn");

const auctionMessage = document.getElementById("auctionMessage");

const myTeam = document.getElementById("myTeam");


/* =========================
   球員
========================= */

const players = [

  {name:"Stephen Curry",position:"PG",ovr:94},
  {name:"Luka Doncic",position:"PG",ovr:95},

  {name:"Anthony Edwards",position:"SG",ovr:95},
  {name:"Devin Booker",position:"SG",ovr:93},

  {name:"LeBron James",position:"SF",ovr:94},
  {name:"Jayson Tatum",position:"SF",ovr:94},

  {name:"Giannis Antetokounmpo",position:"PF",ovr:97},
  {name:"Kevin Durant",position:"PF",ovr:93},

  {name:"Nikola Jokic",position:"C",ovr:98},
  {name:"Joel Embiid",position:"C",ovr:92}

];


/* =========================
   全域變數
========================= */

let myRole = null;
let roomId = null;
let roomListener = null;

let localPlayers = [];
let localIndex = 0;


/* =========================
   畫面切換
========================= */

function showScreen(screen){

  home.classList.add("hidden");
  lobby.classList.add("hidden");
  auction.classList.add("hidden");
  series.classList.add("hidden");

  screen.classList.remove("hidden");
}


/* =========================
   產生房號
========================= */

function generateRoomCode(){

  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for(let i=0;i<6;i++){

    result += chars[
      Math.floor(Math.random()*chars.length)
    ];

  }

  return result;

}


/* =========================
   Firebase 登入
========================= */

async function ensureLogin(){

  if(!firebaseReady){

    throw new Error("Firebase 沒有成功載入");

  }

  if(currentUser){

    return currentUser;

  }

  const result =
    await auth.signInAnonymously();

  currentUser = result.user;

  return currentUser;

}


/* =========================
   建立房間
========================= */

async function createRoom(){

  lobbyMessage.innerText = "正在建立房間...";

  try{

    const user = await ensureLogin();

    roomId = generateRoomCode();

    const shuffled =
      [...players].sort(
        ()=>Math.random()-0.5
      );

    await db.ref("rooms/"+roomId).set({

      status:"waiting",

      host:user.uid,

      playersOrder:shuffled,

      p1:{
        uid:user.uid,
        money:20,
        team:[]
      },

      p2:null,

      currentIndex:0,

      currentBid:0,

      currentLeader:null,

      turn:1

    });

    myRole = 1;

    roomCode.innerText = roomId;

    showScreen(lobby);

    listenRoom();

  }catch(error){

    console.error(error);

    lobbyMessage.innerText =
      "建立失敗：" + error.message;

  }

}


/* =========================
   加入房間
========================= */

async function joinRoom(){

  const code =
    roomInput.value
      .trim()
      .toUpperCase();

  if(code.length !== 6){

    alert("請輸入6碼房號");

    return;

  }

  lobbyMessage.innerText = "正在加入房間...";

  try{

    const user = await ensureLogin();

    const ref =
      db.ref("rooms/"+code);

    const snapshot =
      await ref.once("value");

    if(!snapshot.exists()){

      alert("找不到這個房間");

      return;

    }

    const room = snapshot.val();

    if(room.p2){

      alert("房間已經有兩個人");

      return;

    }

    if(room.status !== "waiting"){

      alert("這個房間已經開始遊戲");

      return;

    }

    await ref.child("p2").set({

      uid:user.uid,

      money:20,

      team:[]

    });

    roomId = code;

    myRole = 2;

    roomCode.innerText = code;

    showScreen(lobby);

    listenRoom();

  }catch(error){

    console.error(error);

    lobbyMessage.innerText =
      "加入失敗：" + error.message;

  }

}


/* =========================
   監聽房間
========================= */

function listenRoom(){

  if(roomListener){

    roomListener.off();

  }

  roomListener =
    db.ref("rooms/"+roomId);

  roomListener.on("value",(snapshot)=>{

    const room = snapshot.val();

    if(!room){

      alert("房間不存在");

      showScreen(home);

      return;

    }

    updateLobby(room);

    if(room.status === "auction"){

      renderAuction(room);

      showScreen(auction);

    }

    if(room.status === "series"){

      showScreen(series);

    }

  });

}


/* =========================
   房間畫面
========================= */

function updateLobby(room){

  p1Status.innerText =
    room.p1
      ? "已加入"
      : "等待中";

  p2Status.innerText =
    room.p2
      ? "已加入"
      : "等待中";

  if(room.p1 && room.p2){

    lobbyMessage.innerText =
      "兩位玩家都已加入，可以開始！";

  }else{

    lobbyMessage.innerText =
      "等待另一位玩家加入...";

  }

  if(
    myRole === 1 &&
    room.p1 &&
    room.p2
  ){

    startBtn.classList.remove("hidden");

  }else{

    startBtn.classList.add("hidden");

  }

}


/* =========================
   開始競標
========================= */

async function startOnlineGame(){

  const ref =
    db.ref("rooms/"+roomId);

  const snapshot =
    await ref.once("value");

  const room =
    snapshot.val();

  if(!room.p1 || !room.p2){

    alert("還需要兩位玩家");

    return;

  }

  await ref.update({

    status:"auction",

    currentIndex:0,

    currentBid:0,

    currentLeader:null,

    turn:1

  });

}


/* =========================
   顯示競標
========================= */

function renderAuction(room){

  const player =
    room.playersOrder[room.currentIndex];

  if(!player){

    finishAuction(room);

    return;

  }

  auctionPlayer.innerText =
    player.name;

  auctionPosition.innerText =
    player.position;

  auctionOVR.innerText =
    "OVR " + player.ovr;

  currentBid.innerText =
    room.currentBid || 0;

  const me =
    room["p"+myRole];

  const enemy =
    room["p"+(myRole===1?2:1)];

  myMoney.innerText =
    me ? me.money : 20;

  enemyMoney.innerText =
    enemy ? enemy.money : 20;

  if(room.turn === myRole){

    turnText.innerText =
      "🔥 輪到你出價";

    bidBtn.disabled = false;
    passBtn.disabled = false;

  }else{

    turnText.innerText =
      "⏳ 等待對手出價";

    bidBtn.disabled = true;
    passBtn.disabled = true;

  }

}


/* =========================
   出價
========================= */

async function placeBid(){

  try{

    const amount =
      Number(bidInput.value);

    if(!amount){

      alert("請輸入價格");

      return;

    }

    const ref =
      db.ref("rooms/"+roomId);

    const snapshot =
      await ref.once("value");

    const room =
      snapshot.val();

    if(room.turn !== myRole){

      alert("現在不是你的回合");

      return;

    }

    const me =
      room["p"+myRole];

    const current =
      room.currentBid || 0;

    if(amount <= current){

      alert(
        "出價必須大於目前價格"
      );

      return;

    }

    if(amount > me.money){

      alert(
        "你的點數不夠"
      );

      return;

    }

    await ref.update({

      currentBid:amount,

      currentLeader:myRole,

      turn:myRole===1 ? 2 : 1

    });

    bidInput.value = "";

  }catch(error){

    console.error(error);

    alert("出價失敗");

  }

}


/* =========================
   放棄競標
========================= */

async function passAuction(){

  try{

    const ref =
      db.ref("rooms/"+roomId);

    const snapshot =
      await ref.once("value");

    const room =
      snapshot.val();

    if(room.turn !== myRole){

      return;

    }

    if(!room.currentLeader){

      alert("第一個人還沒有出價");

      return;

    }

    const winner =
      room.currentLeader;

    const price =
      room.currentBid;

    const winnerData =
      room["p"+winner];

    winnerData.money -= price;

    if(!winnerData.team){

      winnerData.team = [];

    }

    winnerData.team.push(
      room.playersOrder[
        room.currentIndex
      ]
    );

    const nextIndex =
      room.currentIndex + 1;

    if(nextIndex >= 10){

      await ref.update({

        ["p"+winner]:winnerData,

        status:"series"

      });

      return;

    }

    await ref.update({

      ["p"+winner]:winnerData,

      currentIndex:nextIndex,

      currentBid:0,

      currentLeader:null,

      turn:
        nextIndex % 2 === 0
          ? 1
          : 2

    });

  }catch(error){

    console.error(error);

  }

}


/* =========================
   結束選秀
========================= */

async function finishAuction(room){

  if(room.status === "series"){

    return;

  }

  await db.ref("rooms/"+roomId).update({

    status:"series"

  });

}


/* =========================
   單人模式
========================= */

function startSingle(){

  localPlayers =
    [...players].sort(
      ()=>Math.random()-0.5
    );

  localIndex = 0;

  alert(
    "單人模式之後會加入完整電腦AI競標"
  );

}


/* =========================
   返回
========================= */

function backHome(){

  if(roomListener){

    roomListener.off();

    roomListener = null;

  }

  roomId = null;
  myRole = null;

  showScreen(home);

}


/* =========================
   按鈕事件
========================= */

singleBtn.addEventListener(
  "click",
  startSingle
);

createBtn.addEventListener(
  "click",
  createRoom
);

joinBtn.addEventListener(
  "click",
  joinRoom
);

startBtn.addEventListener(
  "click",
  startOnlineGame
);

backBtn.addEventListener(
  "click",
  backHome
);

bidBtn.addEventListener(
  "click",
  placeBid
);

passBtn.addEventListener(
  "click",
  passAuction
);


/* =========================
   Enter 加入房間
========================= */

roomInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      joinRoom();

    }

  }
);


/* =========================
   Firebase 登入狀態
========================= */

if(firebaseReady){

  auth.onAuthStateChanged(
    function(user){

      if(user){

        currentUser = user;

        console.log(
          "匿名登入成功：",
          user.uid
        );

      }

    }
  );

}


/* =========================
   啟動
========================= */

console.log("🏀 籃球選秀網站啟動");

</script>

</body>
</html>
